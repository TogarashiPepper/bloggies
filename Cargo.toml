[package]
name = "bloggies"
version = "0.1.0"
edition = "2024"
default-run = "bloggies"

[dependencies]
anyhow = "1.0.102"
dotenvy = "0.15.7"

[dependencies.serenity]
version = "0.12.5"
features = ["collector"]

[dependencies.tokio]
version = "1.52.3"
features = ["macros", "rt-multi-thread"]

[lints.clippy]
nursery = "warn"
pedantic = "warn"
